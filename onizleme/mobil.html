<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Asista — Mobil tasarım önizlemesi</title><link rel="icon" href="mark.svg" type="image/svg+xml"><style>
:root{font-family:'Segoe UI',Arial,sans-serif;color:#11233f;background:#eaf0f4}*{box-sizing:border-box}body{margin:0}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px 28px;background:#fff;border-bottom:1px solid #cdd9e3}h1{font-size:18px;margin:0}header p{font-size:12px;color:#4d5e73;margin:6px 0 0}a{color:#11233f;min-height:44px;display:inline-flex;align-items:center;font-size:13px}main{padding:24px 16px 40px;text-align:center}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:18px}.controls label{padding:12px 16px;min-height:44px;background:white;border:1px solid #cdd9e3;border-radius:30px;cursor:pointer;font-size:13px}.controls input{accent-color:#08786f;margin-right:6px}.phone{width:min(390px,100%);margin:auto;border:7px solid #11233f;border-radius:27px;overflow:hidden;background:white;box-shadow:0 20px 60px #11233f22;transition:width .2s}.phone iframe{width:100%;height:780px;max-height:78dvh;border:0;display:block}.preview:has(#small:checked) .phone{width:min(334px,100%)}.preview:has(#medium:checked) .phone{width:min(404px,100%)}.preview:has(#large:checked) .phone{width:min(444px,100%)}.note{font-size:12px;line-height:1.8;color:#4d5e73;margin:20px auto 0;max-width:500px}a:focus-visible,label:focus-within{outline:3px solid #08786f;outline-offset:4px}@media(max-width:500px){header{padding:16px}main{padding:16px 8px}.phone{border-width:4px;border-radius:18px}.phone iframe{height:75dvh}.controls label{padding:11px;font-size:12px}.note{padding-inline:15px}}@media(prefers-reduced-motion:reduce){.phone{transition:none}}
</style></head><body><header><div><h1>Asista / Mobil tasarım</h1><p>Aynı sitenin farklı telefon genişliklerindeki yerleşimi.</p></div><a href="index.html">Siteyi doğrudan aç ↗</a></header><main class="preview"><div class="controls" role="group" aria-label="Telefon genişliği"><label><input id="small" type="radio" name="size">320 px</label><label><input id="medium" type="radio" name="size" checked>390 px</label><label><input id="large" type="radio" name="size">430 px</label></div><div class="phone"><iframe src="index.html" title="Asista mobil site önizlemesi"></iframe></div><p class="note">Telefon çerçevesinin içinde kaydırarak sayfayı inceleyebilirsiniz. Bu bir tasarım önizlemesidir; iletişim bağlantıları gerçek bilgiler eklendiğinde etkinleşecek.</p></main></body></html>
